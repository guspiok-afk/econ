<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base econômica — conferência das séries</title>
<style>
  :root {
    --paper:#EFF2F4; --surface:#FFFFFF; --surface-2:#E4E9ED;
    --ink:#141A21; --ink-2:#414E5C; --ink-3:#6B7887;
    --rule:#CBD4DC; --rule-strong:#A9B6C2; --accent:#21497E;
    --ok:#2C6B49; --ok-soft:#DCEBE1; --warn:#9A6410; --warn-soft:#F6E9CF;
    --stop:#97362B; --stop-soft:#F6DEDA; --idle:#6B7887; --idle-soft:#E4E9ED;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#101519; --surface:#171E25; --surface-2:#1E272F;
      --ink:#E4EAEF; --ink-2:#B3C0CC; --ink-3:#8494A3;
      --rule:#27333D; --rule-strong:#37474F; --accent:#7FA9DF;
      --ok:#74BE92; --ok-soft:#16301F; --warn:#DCA843; --warn-soft:#34260C;
      --stop:#E08578; --stop-soft:#351814; --idle:#8494A3; --idle-soft:#1E272F;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-size:15px; line-height:1.5;
         font-family:-apple-system,"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .mono, code, .num { font-family:ui-monospace,Consolas,"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; }
  .wrap { max-width:1180px; margin:0 auto; padding:28px 20px 80px; display:grid; gap:26px; }
  h1 { margin:0; font-size:clamp(24px,3.4vw,34px); line-height:1.1; letter-spacing:-.02em; }
  h2 { margin:0 0 10px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);
       padding-bottom:7px; border-bottom:1px solid var(--rule-strong); }
  .stamp { font-family:ui-monospace,monospace; font-size:11.5px; letter-spacing:.05em;
           text-transform:uppercase; color:var(--ink-3); display:flex; gap:14px; flex-wrap:wrap; }
  .counters { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px;
              background:var(--rule); border:1px solid var(--rule); border-radius:6px; overflow:hidden; }
  .counter { background:var(--surface); padding:11px 13px; }
  .counter .n { display:block; font-size:24px; font-weight:600; line-height:1.15; font-variant-numeric:tabular-nums; }
  .counter .l { display:block; font-family:ui-monospace,monospace; font-size:10px; letter-spacing:.07em;
                text-transform:uppercase; color:var(--ink-3); }
  .finding { display:grid; grid-template-columns:auto 8.5rem 1fr; gap:10px; align-items:baseline;
             padding:7px 12px; border-top:1px solid var(--rule); background:var(--surface); cursor:pointer; }
  .finding:first-of-type { border-top:0; }
  .finding:hover { background:var(--surface-2); }
  .findings { border:1px solid var(--rule); border-radius:6px; overflow:hidden; }
  .sev { font-family:ui-monospace,monospace; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
         padding:2px 6px; border-radius:3px; white-space:nowrap; }
  .sev.alto { background:var(--stop-soft); color:var(--stop); }
  .sev.medio { background:var(--warn-soft); color:var(--warn); }
  .sev.baixo { background:var(--idle-soft); color:var(--idle); }
  .finding .id { font-family:ui-monospace,monospace; font-size:12.5px; color:var(--accent); }
  .finding .msg { color:var(--ink-2); font-size:14px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=search], select { font:inherit; padding:7px 10px; border:1px solid var(--rule);
    border-radius:5px; background:var(--surface); color:var(--ink); }
  input[type=search] { flex:1 1 240px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:10px; }
  .card { background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:11px 13px;
          display:grid; gap:7px; cursor:pointer; }
  .card:hover { border-color:var(--rule-strong); }
  .card .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .card .sid { font-family:ui-monospace,monospace; font-size:12px; color:var(--accent); }
  .card h3 { margin:0; font-size:14.5px; font-weight:600; line-height:1.3; }
  .card .meta { font-family:ui-monospace,monospace; font-size:11px; color:var(--ink-3);
                display:flex; gap:5px 12px; flex-wrap:wrap; }
  .pill { font-family:ui-monospace,monospace; font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
          padding:2px 6px; border-radius:3px; white-space:nowrap; }
  .pill.ok { background:var(--ok-soft); color:var(--ok); }
  .pill.stale { background:var(--warn-soft); color:var(--warn); }
  .pill.no_data, .pill.desconhecido { background:var(--idle-soft); color:var(--idle); }
  .pill.unknown_lag { background:var(--idle-soft); color:var(--idle); }
  svg.spark { width:100%; height:54px; display:block; }
  svg .line { fill:none; stroke:var(--accent); stroke-width:1.4; }
  svg .zero { stroke:var(--rule-strong); stroke-width:1; stroke-dasharray:2 3; }
  dialog { border:1px solid var(--rule-strong); border-radius:8px; background:var(--surface); color:var(--ink);
           max-width:min(920px,94vw); width:100%; padding:0; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dlg { padding:18px 20px; display:grid; gap:12px; }
  .dlg svg.spark { height:230px; }
  .kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:8px 18px; font-size:13.5px; }
  .kv div span { display:block; font-family:ui-monospace,monospace; font-size:10px; letter-spacing:.06em;
                 text-transform:uppercase; color:var(--ink-3); }
  .readout { font-family:ui-monospace,monospace; font-size:13px; color:var(--ink-2); min-height:1.4em; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; background:var(--surface);
          border:1px solid var(--rule); border-radius:6px; overflow:hidden; }
  th, td { padding:6px 11px; border-top:1px solid var(--rule); text-align:left; }
  thead th { border-top:0; font-family:ui-monospace,monospace; font-size:10px; letter-spacing:.06em;
             text-transform:uppercase; color:var(--ink-3); }
  td.num { text-align:right; font-family:ui-monospace,monospace; }
  a { color:var(--accent); }
  .note { color:var(--ink-3); font-size:13.5px; margin:0; }
  button.close { border:1px solid var(--rule); background:var(--surface-2); color:var(--ink);
                 border-radius:5px; padding:5px 12px; font:inherit; cursor:pointer; justify-self:start; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="stamp" id="stamp"></div>
    <h1>Base econômica — conferência das séries</h1>
    <p class="note" id="scope"></p>
    <div class="counters" id="counters" style="margin-top:14px"></div>
  </header>

  <section>
    <h2>Onde olhar <span style="text-transform:none;letter-spacing:0;font-size:13px">— clique para abrir a série</span></h2>
    <div class="findings" id="findings"></div>
  </section>

  <section>
    <h2>Séries</h2>
    <div class="bar" style="margin-bottom:10px">
      <input type="search" id="q" placeholder="filtrar por título, identificador, conceito ou unidade">
      <select id="fsource"></select>
      <select id="fstatus"></select>
      <span class="mono" id="count" style="color:var(--ink-3);font-size:12px"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section>
    <h2>Últimas coletas</h2>
    <table id="runs"><thead><tr>
      <th>execução</th><th>quando</th><th>gatilho</th><th>estado</th>
      <th class="num">séries</th><th class="num">erros</th>
    </tr></thead><tbody></tbody></table>
  </section>
</div>

<dialog id="dlg"><div class="dlg">
  <div>
    <div class="mono" id="d-sid" style="color:var(--accent);font-size:12.5px"></div>
    <h3 id="d-title" style="margin:2px 0 0;font-size:19px"></h3>
  </div>
  <div id="d-chart"></div>
  <div class="readout" id="d-read"></div>
  <div class="kv" id="d-kv"></div>
  <p class="note" id="d-find"></p>
  <button class="close" onclick="document.getElementById('dlg').close()">fechar</button>
</div></dialog>

<script>
const DATA = __DATA__;
const $ = (s) => document.querySelector(s);
const byId = Object.fromEntries(DATA.series.map(s => [s.series_id, s]));
const fmt = (v, d = 4) => v === null || v === undefined ? '—'
  : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: d });

function spark(points, h = 54) {
  if (!points || points.length < 2) return '<svg class="spark"></svg>';
  const w = 1000, pad = 3;
  const vals = points.map(p => p[1]);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
  const x = i => pad + (i * (w - 2 * pad)) / (points.length - 1);
  const y = v => h - pad - ((v - lo) / span) * (h - 2 * pad);
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p[1]).toFixed(1)}`).join(' ');
  const zero = (lo < 0 && hi > 0)
    ? `<line class="zero" x1="0" x2="${w}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/>` : '';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${zero}<path class="line" d="${d}"/></svg>`;
}

function counters() {
  const t = DATA.totals;
  const items = [
    [t.series, 'séries'], [fmt(t.observations, 0), 'observações'],
    [t.sources, 'fontes'], [t.findings, 'apontamentos'],
    [t.high, 'de atenção alta'], [t.stale, 'paradas'],
  ];
  $('#counters').innerHTML = items
    .map(([n, l]) => `<div class="counter"><span class="n">${n}</span><span class="l">${l}</span></div>`).join('');
  $('#stamp').innerHTML = [`gerado em ${DATA.generated_at.replace('T', ' ')}`,
    `${t.earliest || '?'} → ${t.latest || '?'}`, `${fmt(t.open_intervals, 0)} intervalos vigentes`]
    .map(s => `<span>${s}</span>`).join('');
  $('#scope').textContent = DATA.trimmed
    ? 'Versão reduzida: séries marcadas como não redistribuíveis aparecem com metadados e sem valores.'
    : 'Arquivo local e completo. Um terço do catálogo não é redistribuível — não publique este arquivo.';
}

function findings() {
  const el = $('#findings');
  if (!DATA.findings.length) {
    el.innerHTML = '<div class="finding"><span class="sev baixo">nada</span><span class="id">—</span>' +
      '<span class="msg">nenhum apontamento: toda série tem dados, está dentro do prazo e sem lacuna na grade</span></div>';
    return;
  }
  el.innerHTML = DATA.findings.map(f =>
    `<div class="finding" onclick="open_series('${f.series_id}')">
       <span class="sev ${f.severity}">${f.severity}</span>
       <span class="id">${f.series_id}</span>
       <span class="msg"><b>${f.kind}</b> · ${f.message}</span>
     </div>`).join('');
}

function card(s) {
  const pill = `<span class="pill ${s.status}">${s.status}</span>`;
  const meta = [s.entity, s.freq, s.unit || '—', `${fmt(s.n_obs, 0)} obs`,
    s.revisions ? `${fmt(s.revisions, 0)} rev` : null].filter(Boolean);
  return `<div class="card" onclick="open_series('${s.series_id}')">
    <div class="top"><span class="sid">${s.series_id}</span>${pill}</div>
    <h3>${s.title}</h3>
    ${spark(s.points)}
    <div class="meta">${meta.map(m => `<span>${m}</span>`).join('')}</div>
    <div class="meta"><span>último: ${s.last_period || '—'}</span><span>${fmt(s.last_value)}</span></div>
  </div>`;
}

function render() {
  const q = $('#q').value.trim().toLowerCase();
  const src = $('#fsource').value, st = $('#fstatus').value;
  const rows = DATA.series.filter(s => {
    if (src && s.source !== src) return false;
    if (st && s.status !== st) return false;
    if (!q) return true;
    return [s.series_id, s.title, s.concept, s.unit, s.entity].filter(Boolean)
      .some(v => String(v).toLowerCase().includes(q));
  });
  $('#grid').innerHTML = rows.map(card).join('');
  $('#count').textContent = `${rows.length} de ${DATA.series.length}`;
}

function open_series(id) {
  const s = byId[id];
  if (!s) return;
  $('#d-sid').textContent = s.series_id;
  $('#d-title').textContent = s.title;
  $('#d-chart').innerHTML = s.points.length ? spark(s.points, 230)
    : '<p class="note">valores omitidos nesta versão por não serem redistribuíveis</p>';
  const kv = [
    ['conceito', s.concept || '—'], ['país', s.entity], ['fonte', s.source],
    ['unidade', s.unit || '—'], ['frequência', s.freq],
    ['ajuste sazonal', s.seasonal_adj ? 'sim' : 'não'],
    ['cobertura', `${s.first_period || '?'} → ${s.last_period || '?'}`],
    ['observações', fmt(s.n_obs, 0)], ['revisões guardadas', fmt(s.revisions, 0)],
    ['último valor', fmt(s.last_value)], ['mínimo', fmt(s.min)], ['máximo', fmt(s.max)],
    ['prazo esperado', s.expected_lag_days != null ? `${s.expected_lag_days} dias` : '—'],
    ['frescor', s.status], ['licença', s.license || '—'],
    ['redistribuível', s.redistributable ? 'sim' : 'não'],
  ];
  $('#d-kv').innerHTML = kv.map(([k, v]) => `<div><span>${k}</span>${v}</div>`).join('') +
    (s.source_url ? `<div><span>origem</span><a href="${s.source_url}" target="_blank" rel="noopener">abrir</a></div>` : '');
  const mine = DATA.findings.filter(f => f.series_id === id);
  $('#d-find').textContent = mine.length
    ? 'Apontamentos: ' + mine.map(f => `${f.kind} (${f.severity}) — ${f.message}`).join(' · ')
    : 'Sem apontamentos.';
  const svg = $('#d-chart').querySelector('svg');
  if (svg && s.points.length) {
    svg.addEventListener('mousemove', ev => {
      const r = svg.getBoundingClientRect();
      const i = Math.round(((ev.clientX - r.left) / r.width) * (s.points.length - 1));
      const p = s.points[Math.max(0, Math.min(s.points.length - 1, i))];
      $('#d-read').textContent = `${p[0]}   ${fmt(p[1])}`;
    });
  } else { $('#d-read').textContent = ''; }
  $('#dlg').showModal();
}

function runs() {
  $('#runs tbody').innerHTML = DATA.runs.map(r =>
    `<tr><td class="mono">${r.run_id}</td><td class="mono">${r.started_at.replace('T', ' ').slice(0, 19)}</td>
     <td>${r.trigger}</td><td>${r.status}</td>
     <td class="num">${r.n_series}</td><td class="num">${r.n_errors}</td></tr>`).join('')
    || '<tr><td colspan="6">nenhuma coleta registrada</td></tr>';
}

function selects() {
  const uniq = (k) => [...new Set(DATA.series.map(s => s[k]))].sort();
  $('#fsource').innerHTML = '<option value="">todas as fontes</option>' +
    uniq('source').map(v => `<option>${v}</option>`).join('');
  $('#fstatus').innerHTML = '<option value="">todos os estados</option>' +
    uniq('status').map(v => `<option>${v}</option>`).join('');
}

counters(); findings(); selects(); render(); runs();
$('#q').addEventListener('input', render);
$('#fsource').addEventListener('change', render);
$('#fstatus').addEventListener('change', render);
</script>
</body>
</html>
