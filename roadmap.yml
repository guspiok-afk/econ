schema: econ/roadmap/1

# O que existe, o que falta, o que se decidiu e o que ainda não se sabe.
#
# Mesmo formato do `roadmap.yml` do Projeto Finanças e do PMA, adotado em 06/09/2026 porque as
# sete fases do `.pma/project.yaml` são grossas demais para acompanhar trabalho: elas dizem que a
# fase 5 está "em curso" e não dizem o que dentro dela está preso, por quê, nem qual teste garante
# o que já foi entregue.
#
# A regra que faz este arquivo valer alguma coisa é `preso_por`: todo marco validado nomeia os
# testes que o sustentam. Marco sem `preso_por` não é validado, é afirmado. Os dois defeitos
# achados em 06/09 — o backtest lendo o trimestre que dizia estimar, e a coleta diária lida como
# histórico de revisão — passaram por suíte verde justamente porque o que os prendia não existia.
#
# `.pma/project.yaml` continua sendo o manifesto que o PMA lê. Este arquivo é o detalhe.

projeto:
  id: econ
  nome: Base econômica e camada de análises
  repo: guspiok-afk/econ
  raiz: C:\dev\econ
  desde: 2026-09-03
  fonte_da_verdade: >
    Parquet em %LOCALAPPDATA%\econbase\data\lake, com troca atômica de manifesto. O arquivo
    DuckDB é cache reconstruível por `econbase rebuild-db` e nunca é a verdade.

fases:
  - {id: F0, nome: "Fundação: contrato, armazenamento, pipeline bitemporal", estado: fechada}
  - {id: F1, nome: "Conectores e catálogo", estado: fechada}
  - {id: F2, nome: "Transformações, API e automação", estado: fechada}
  - {id: F3, nome: "Análises tier 1", estado: fechada}
  - {id: F4, nome: "Nowcasting e índices", estado: aberta}
  - {id: F5, nome: "DSGE", estado: a_fazer}
  - {id: F6, nome: "Interface funcional sobre a base e os modelos", estado: a_fazer}
  - {id: F7, nome: "Preços de ativos (projeto irmão, mesmo repositório)", estado: a_fazer}

modulos:
  # ---------------------------------------------------------------- F0, fundação
  - id: M001
    fase: F0
    nome: "Contrato de dados e esquemas"
    estado: validado
    depende_de: []
    criterio_aceite: >
      observations(series_id, period, value, realtime_start, realtime_end, observed_at, run_id)
      com chave lógica (series_id, period, realtime_start); ids imutáveis `{source}:{native_id}`.
    preso_por: ["tests/test_schemas.py", "tests/test_catalog_ids.py"]

  - id: M002
    fase: F0
    nome: "Store: Parquet como verdade, troca atômica de manifesto"
    estado: validado
    depende_de: [M001]
    criterio_aceite: >
      Escrita em staging e troca de manifest.json atômica; views obs_latest/obs_asof/
      obs_first_release; rebuild-db e gc idempotentes.
    preso_por: ["tests/test_store.py"]

  - id: M003
    fase: F0
    nome: "Pipeline bitemporal: intervalos ALFRED, não snapshots"
    estado: validado
    depende_de: [M002]
    criterio_aceite: >
      Duas coletas com valor alterado geram dois intervalos [start, end) com fim exclusivo;
      check_invariants recusa sobreposição, intervalo invertido e mais de uma linha aberta.
    preso_por: ["tests/test_pipeline.py", "tests/test_pipeline_guards.py"]
    nota: >
      Revisado adversarialmente em 06/09/2026 pelo Antigravity: três das seis áreas sem defeito
      real, um achado refutado por medição (VALUE_ATOL é 1e-12, não 1e-8) e um com mecanismo
      certo e severidade invertida — uma fonte que reescreva o próprio histórico faz o pipeline
      RECUSAR, não corromper. Registrado em teste.

  - id: M004
    fase: F0
    nome: "Guarda contra escrita redirecionada"
    estado: validado
    depende_de: [M002]
    criterio_aceite: >
      Uma sonda comportamental detecta redirecionamento MSIX de escrita e a Transaction recusa,
      a menos que ECONBASE_ALLOW_REDIRECTED_WRITES esteja ligado de propósito.
    preso_por: ["tests/test_redirected_writes.py", "tests/test_settings.py"]
    nota: >
      Nasceu do episódio em que declarei a base perdida com base num teste de arquivo-marcador
      inválido — a listagem de diretório é mesclada no MSIX, a escrita não. Nada havia se perdido.

  - id: M005
    fase: F0
    nome: "Guarda de árvore: uma mesclagem não pode apagar trabalho"
    estado: validado
    depende_de: []
    criterio_aceite: "28 caminhos que devem existir, mais pisos por padrão de arquivo."
    preso_por: ["tests/test_tree.py"]
    nota: "Escrito depois que a mesclagem do PR 23 apagou 4.290 linhas em 43 arquivos."

  # ---------------------------------------------------------------- F1, conectores
  - id: M010
    fase: F1
    nome: "Conectores: FRED, BCB (SGS, PTAX, Focus), SIDRA, IPEA, DBnomics, arquivo HTTP"
    estado: validado
    depende_de: [M003]
    criterio_aceite: >
      Cada conector com respostas HTTP gravadas; FRED busca o realtime completo, que o fredapi
      não expõe.
    preso_por: ["tests/test_source_fred.py", "tests/test_source_bcb.py", "tests/test_source_sidra_ipea.py", "tests/test_source_dbnomics_files.py"]

  - id: M011
    fase: F1
    nome: "Catálogo inicial"
    estado: validado
    depende_de: [M010]
    criterio_aceite: "Séries carregando por conceito e entidade, com licença e redistribuibilidade."
    preso_por: ["tests/test_catalog.py", "tests/test_catalog_br.py", "tests/test_catalog_us.py", "tests/test_catalog_ids.py"]
    nota: >
      73 séries contra as ~120 planejadas: 42 BR, 30 US, 1 global. 33 não redistribuíveis, o que
      mantém a página de conferência local. As que faltam são de menor prioridade e nenhuma trava
      um modelo.

  # ---------------------------------------------------------------- F2, API e automação
  - id: M020
    fase: F2
    nome: "API por conceito, com corte por data de conhecimento"
    estado: validado
    depende_de: [M011]
    criterio_aceite: >
      api.get e api.get_panel aceitam conceito, série ou (conceito, entidade); ordem fixa —
      ler as-of, converter frequência, transformar, aparar por data.
    preso_por: ["tests/test_api.py"]

  - id: M021
    fase: F2
    nome: "Rotina diária no agendador local"
    estado: validado
    depende_de: [M020]
    criterio_aceite: "Duas execuções por dia, com registro em `runs` e log legível."
    preso_por: ["tests/test_daily_script.py"]
    nota: "Medido em 06/09/2026: execução das 12:15 com 73 séries e zero erros."

  - id: M022
    fase: F2
    nome: "Página de conferência das séries"
    estado: validado
    depende_de: [M020]
    criterio_aceite: >
      Um HTML autocontido com gráfico por série e auditoria ordenada por gravidade
      (pico_isolado, estagnada, lacuna, parada, sem_dados, tudo_nulo).
    preso_por: ["tests/test_report.py"]
    nota: "Local por obrigação: 33 das 73 séries não são redistribuíveis."

  # ---------------------------------------------------------------- F3, análises
  - id: M030
    fase: F3
    nome: "Guarda de painel: `requires` passa a significar alguma coisa"
    estado: validado
    depende_de: [M020]
    criterio_aceite: >
      column_for resolve só conceito@entidade, sem adivinhação; check_frequency recusa grade
      fora do padrão e com buracos; panel_for finalmente lê model.requires.
    preso_por: ["tests/test_panel_guard.py"]
    nota: >
      Até existir, dois modelos adivinhavam a coluna e a declaração de frequência era decorativa:
      um deslocamento de quatro linhas num painel mensal virava variação anual com seis pontos
      percentuais de erro e nenhum aviso.

  - id: M031
    fase: F3
    nome: "Paridade descoberta de juros, regressão de Fama"
    estado: validado
    depende_de: [M030]
    criterio_aceite: "Erros-padrão de Newey-West para janelas sobrepostas."
    preso_por: ["tests/test_parity.py"]
    nota: "β = −0,628 ao vivo — o sinal negativo clássico, contra a hipótese nula de 1."

  - id: M032
    fase: F3
    nome: "Regra de Taylor com variantes e hiato por filtro"
    estado: validado
    depende_de: [M030]
    criterio_aceite: "Reproduz Taylor 1993; hiato calculado sobre o painel as-of."
    preso_por: ["tests/test_taylor.py"]
    nota: >
      US prescrito 6,40 contra 3,63 efetivo; BR 9,94 contra 14,25. O número brasileiro está
      SUSPENSO pela lacuna C1: o hiato foi filtrado sobre série sazonal.

  - id: M033
    fase: F3
    nome: "VAR monetário com identificação recursiva"
    estado: validado
    depende_de: [M030]
    criterio_aceite: "IRFs por Cholesky, com o quebra-cabeça dos preços preservado e não escondido."
    preso_por: ["tests/test_var.py"]

  - id: M034
    fase: F3
    nome: "Curva de Phillips do BCB, e uma especificação é um arquivo"
    estado: validado
    depende_de: [M030]
    criterio_aceite: >
      Spec em YAML validado por pydantic, com spec_id e spec_hash; verticalidade imposta somando
      exatamente 1,0000; controle negativo deliberado ao lado.
    preso_por: ["tests/test_phillips.py", "tests/test_specs.py"]
    nota: >
      ADR-0007. O teste de aceitação original exigia bater a margem do Focus medida numa
      especificação mais crua; a do Banco perde por 11%. O teste passou a reportar a razão em vez
      de servir de portão — erro meu, corrigido medindo.

  - id: M035
    fase: F3
    nome: "Projeções locais de Jordà"
    estado: validado
    depende_de: [M030]
    criterio_aceite: >
      Uma regressão por horizonte, HAC com maxlags=h; piso de observações que ESCALA com os
      parâmetros; horizonte zero não é estimado nem contado.
    preso_por: ["tests/test_local_projections.py"]
    nota: >
      Vale do produto −1,0156 em h=10. As guardas vieram da implementação do Jules (PR 39), que
      passava 16/16 nos meus testes de aceitação e era melhor que a minha em quatro pontos.

  - id: M036
    fase: F3
    nome: "VAR identificado por restrições de sinal"
    estado: validado
    depende_de: [M033]
    criterio_aceite: >
      O resultado é um conjunto, com banda e taxa de aceitação nas diagnósticas; guarda de
      amostra que conta o que as defasagens consomem.
    preso_por: ["tests/test_sign_restrictions.py"]
    nota: >
      Transforma +0,3779 do recursivo em −0,1427; aceitação 2,03%, caindo para 0,13% com
      restrição de cinco anos. Guardas vindas do Jules (PR 40), 18/18.

  # ---------------------------------------------------------------- F4, nowcasting
  - id: M040
    fase: F4
    nome: "Simulador de vintages: reconstruir o que era conhecido"
    estado: validado
    depende_de: [M020]
    criterio_aceite: >
      published_at = fim do período + expected_lag_days; pseudo_asof nunca devolve linha que não
      estaria publicada; `true` sobre série sem vintages levanta VintageError em vez de devolver
      vazio; SÓ o catálogo decide se a série tem vintages reais.
    preso_por: ["tests/test_vintages.py"]
    nota: >
      A cláusula final foi escrita depois do defeito: uma heurística lia coleta diária rotineira
      como histórico de revisão — `bcb_sgs:432` tinha três realtime_start após três dias — e a
      Selic brasileira as-of 2024 voltava com ZERO linhas em silêncio, que é a falha que este
      módulo existe para acabar. Achado por revisão delegada ao Antigravity, PR 47.

  - id: M041
    fase: F4
    nome: "Painel irregular: get_panel(mixed_freq=True)"
    estado: validado
    depende_de: [M020]
    criterio_aceite: >
      Série mais grossa que a grade mantém seus períodos nativos e os buracos ficam vazios; série
      mais FINA continua sendo agregada, porque deixada nativa cairia fora da grade e seria
      descartada em silêncio pelo reindex; subir frequência continua recusado.
    preso_por: ["tests/test_api.py"]

  - id: M042
    fase: F4
    nome: "Fator dinâmico de frequência mista, para nowcasting"
    estado: em_revisao
    depende_de: [M040, M041]
    criterio_aceite: >
      Nowcast para trimestre sem alvo publicado; status distingue pending de backfill e gap;
      transformação de estacionariedade declarada por conceito, sem adivinhar; alvo sazonal é
      RECUSADO; o backtest não pode ver o alvo do trimestre que estima.
    preso_por: ["tests/test_dfm.py"]
    nota: >
      PR 42. EUA 2026Q3 em +0,663% no trimestre. RMSE 0,818 contra 2,065 da média incondicional
      em 2018–2025, e 0,501 contra 0,423 nos anos calmos desde 2022 — os dois afirmados em teste
      para que nenhum circule sozinho. A cláusula final do critério nasceu de defeito achado por
      revisão delegada: a série trimestral fica na grade no mês em que o trimestre COMEÇA, e o
      corte por data de referência entregava ao modelo o alvo que ele dizia estimar.

  - id: M043
    fase: F4
    nome: "Backtest pseudo-tempo-real armazenado no store de resultados"
    estado: a_fazer
    depende_de: [M042]
    criterio_aceite: >
      model_runs e model_outputs gravados com git_sha, seed e vintage_kind; o relatório distingue
      vintage real de simulada por série, sem agregar as duas num número só.
    nota: >
      Sem `preso_por` porque nada o prende ainda, e isso é o estado honesto. A primeira versão
      nomeava `tests/test_results_store.py`, que prende o STORE de resultados — uma dependência
      já pronta — e não este marco. A guarda contra marco pendente com teste pronto pegou isso na
      primeira execução dela, que é o mesmo engano do M044 aparecendo de novo: emprestar o teste
      de um vizinho.

  - id: M044
    fase: F4
    nome: "Decomposição livres × administrados do IPCA"
    estado: validado
    depende_de: [M011, M030]
    criterio_aceite: >
      Contribuição de cada parte para a inflação de doze meses, com pesos recuperados em janela
      móvel e somando exatamente 1; a linha de composição fecha a diferença entre somar
      contribuições mensais e compor doze meses, de modo que as participações somem 1; nome
      honesto — é a decomposição do BCB, não sticky-price CPI no sentido do Fed de Atlanta.
    preso_por: ["tests/test_decomposition.py", "tests/test_br_decomposition.py"]
    nota: >
      Séries catalogadas em bcb_sgs 11428 (livres) e 4449 (administrados), desde jan/1991. O peso
      é móvel por medição e não por gosto: numa amostra cheia os administrados pesam 16,1%, mas
      17,9% de 1995 a 2005, 25,1% de 2006 a 2015 e 25,8% depois — o peso cheio é puxado para
      baixo pela hiperinflação até 1994 e não serve a nenhum subperíodo. `test_br_decomposition`
      valida o catálogo, `test_decomposition` valida o modelo; o `preso_por` antes citava só o
      primeiro, e escapou porque a regra do arquivo só morde marco já validado.

  - id: M045
    fase: F4
    nome: "LMCI-BR por componentes principais"
    estado: bloqueado
    depende_de: [M011]
    bloqueado_por: [L05]
    criterio_aceite: "~20 variáveis, com reestimações deixando uma de fora para medir dependência."
    nota: >
      Medido em 06/09/2026: o catálogo brasileiro tem UMA série de mercado de trabalho, a taxa de
      desocupação (sidra:6381/4099, desde mar/2012). Um índice de condições construído sobre uma
      variável não é um índice — é a variável com outro nome. Fica bloqueado até a L05.

  - id: M046
    fase: F4
    nome: "GSCPI ingerido"
    estado: validado
    depende_de: [M010]
    criterio_aceite: >
      Planilha do NY Fed pelo conector de arquivo HTTP; entrada de catálogo declarando folha,
      salto de cabeçalho e `period_is_end`; termos de uso declarados e redistribuição negada;
      o formato do arquivo trancado por teste SEM copiar o dado.
    preso_por: ["tests/test_source_nyfed.py"]
    nota: >
      Estava marcado como a fazer e já rodava: 344 observações de jan/1998 a ago/2026, atualizadas
      pelo agendador. Terceiro marco que este arquivo descreveu de memória do plano em vez de do
      repositório — ver B05.
      A série é `redistributable: false`, então não há fixture com o dado, e a identidade que a
      confirma fica medida em vez de testada: média 0,0077 e desvio 1,0013 sobre as 344
      observações, porque o índice é padronizado na origem. Máximo em dez/2021, 4,431.

  - id: M047
    fase: F4
    nome: "Nowcast do Brasil"
    estado: bloqueado
    depende_de: [M042]
    bloqueado_por: [C1]
    criterio_aceite: "O mesmo do M042, sobre gdp_real@BR, com seasonal_share abaixo de 0,25."
    nota: >
      Hoje o modelo RECUSA rodar o Brasil, e isso é o comportamento certo: com 55,3% da variação
      explicada pelo trimestre do ano, o nowcast seria o calendário.

  # ---------------------------------------------------------------- F6, interface
  - id: M050
    fase: F6
    nome: "Painel gerado a partir do roadmap"
    estado: validado
    depende_de: []
    criterio_aceite: >
      tools/render_roadmap.py lê roadmap.yml e .pma/project.yaml e escreve painel/econ.html
      autocontido, sem edição manual; todo marco, lacuna aberta e decisão chega à página;
      lacunas ordenadas por gravidade; conteúdo escapado; nada de placeholder por substituir.
      `--artifact` emite a mesma página sem esqueleto de documento, para o hospedeiro que fornece
      o seu — publicada em claude.ai/code/artifact/93f5a13e-3e87-4f86-a439-e3dddbdd9398.
    preso_por: ["tests/test_render_roadmap.py", "tests/test_roadmap.py"]
    nota: >
      Primeiro pedaço da F6, e o que resolve o problema que motivou este arquivo: o painel foi
      escrito à mão três vezes em dois dias e errou duas — uma fase entregue reportada como
      pendente, e zero perguntas esperando o mantenedor na mesma hora em que uma bloqueante era
      registrada. Um gerador tira essa deriva por construção: a página não tem outra fonte.

lacunas:
  - id: C1
    gravidade: alta
    titulo: "O PIB brasileiro do catálogo não é dessazonalizado"
    onde: "catalog/br/ibge_sidra.yaml, série sidra:1620/583"
    estado: aberta
    espera: mantenedor
    desde: 2026-09-05
    nota: >
      Declara seasonal_adj true e não é: dummies de trimestre explicam 55,3% da variação do
      crescimento (p = 2,4e-20), contra 0,7% nos EUA. A tabela 1620 é a série encadeada sem
      ajuste; a dessazonalizada é a 1621. Bloqueia M047 e SUSPENDE o resultado brasileiro de
      M032, porque filtrar HP uma série sazonal produz um hiato que é em boa parte o calendário.
      Três opções e uma recomendação em docs/QUESTIONS.md. A decisão muda o contrato de dados.

  - id: L01
    gravidade: media
    titulo: "Quatro convenções de período semanal, nenhuma igual à outra"
    onde: "src/econbase/transforms.py (_PANDAS_RULE), src/econmodels/base.py (_GRID)"
    estado: despachada
    nota: >
      transforms usa W (domingo, fim), base usa W-MON, fred:ICSA rotula sábado e fred:TOTCI
      quarta. check_frequency recusa TODOS os 3.113 períodos do ICSA, então nenhum modelo
      consegue declarar freq="W". Issue #44, com Jules. A resposta tem de tratar ICSA como fluxo
      e TOTCI como estoque medido numa data — o Antigravity errou exatamente aqui.

  - id: L02
    gravidade: media
    titulo: "O modo `mixed` pode produzir um painel temporalmente incoerente"
    onde: "src/econbase/api.py (get_panel), src/econbase/vintages.py"
    estado: mitigada
    nota: >
      Uma série resolvida como `true` volta na versão crua da época; uma resolvida como `pseudo`
      volta com o valor ATUAL, já revisado, retrodatado. No mesmo painel, uma sabe menos que a
      outra sobre o mesmo instante. Achado por revisão delegada em 06/09/2026.
      MITIGADA, não resolvida: o painel passou a carregar `attrs["vintage_kinds"]` e
      `attrs["vintage_split"]`, e um painel que mistura gravada com simulada emite
      `VintageMixWarning`. A incoerência continua existindo — ela é do conceito, não do rótulo —
      mas deixou de ser invisível. Resolver de verdade exigiria ou recusar a mistura, ou
      reconstruir a primeira divulgação das séries simuladas, que o dado não permite.

  - id: L03
    gravidade: baixa
    titulo: "`pseudo` sobre série que TEM vintages reais descarta o histórico em silêncio"
    onde: "src/econbase/api.py (_observations)"
    estado: aberta
    nota: >
      Pedir pseudo para uma série do FRED usa o valor corrente em vez das vintages gravadas.
      É o que foi pedido, mas merece aviso nas diagnósticas.

  - id: L05
    gravidade: media
    titulo: "O Brasil tem uma única série de mercado de trabalho catalogada"
    onde: "catalog/br/ibge_sidra.yaml"
    estado: aberta
    nota: >
      Só a taxa de desocupação (sidra:6381/4099, desde mar/2012). Os conceitos `employment`,
      `wages` e `labor_conditions_index` existem em concepts.yaml e nenhuma série brasileira os
      carrega. Bloqueia o M045. O que falta é PNAD Contínua — população ocupada, taxa de
      participação, rendimento real habitual, horas trabalhadas — e CAGED, admissões e
      desligamentos. **Não catalogar por adivinhação:** sete de catorze títulos adicionados numa
      leva anterior estavam errados na primeira tentativa, e identificador errado é invisível.
      Confirmar tabela e variável no SIDRA antes de escrever a entrada.
      As três escolhas que dependem do mantenedor — amostra curta da PNAD, emenda com a PME, e a
      quebra do CAGED em 2020 — estão em docs/QUESTIONS.md, item T1, para conversa e não como
      bloqueio de execução.

  - id: L04
    gravidade: baixa
    titulo: "O Ollama está no roteamento e nunca foi exercitado neste projeto"
    onde: "AGENTS.md, seção 5"
    estado: aberta

decisoes:
  - id: D01
    titulo: "Julia para o módulo DSGE"
    resposta: "Não. Python resolve o modelo de três equações; Julia custaria 75 a 155 horas fixas."
    arquivo: docs/adr/0004-python-first-dsge-julia-out-of-scope.md
    reabrir_quando: "Perturbação de ordem superior, restrição de piso de juros, ou biblioteca pronta de modelos médios."

  - id: D02
    titulo: "Um repositório ou dois"
    resposta: "Um, com dois pacotes independentes."
    arquivo: docs/adr/0006-two-packages-one-repository.md
    reabrir_quando: "Um repositório irmão precisar fixar versão, ou entrar um segundo colaborador."

  - id: D03
    titulo: "Quem escreve os dados"
    resposta: "Só o agendador local. A integração contínua roda testes e nunca grava dados."
    arquivo: docs/adr/0003-single-writer-task-scheduler.md
    reabrir_quando: "Surgir um leitor remoto ou um aplicativo hospedado."

  - id: D04
    titulo: "Guardar histórico de revisões desde o início"
    resposta: >
      Sim. Já provou o valor: o desemprego americano de abril de 2020 foi publicado em 14,7% e
      hoje lê 14,8%.
    arquivo: docs/adr/0002-bitemporal-vintages.md
    reabrir_quando: nunca

  - id: D05
    titulo: "Sticky CPI brasileiro"
    resposta: "Divisão livres × administrados do próprio Banco Central, e o índice muda de nome."
    reabrir_quando: "Houver microdado de frequência de reajuste, que o Brasil não publica."

  - id: D06
    titulo: "O que um nowcast precisa provar para entrar"
    resposta: >
      Ganho medido contra a média incondicional na amostra completa E a derrota no período calmo
      afirmada por teste junto. Nenhum dos dois números circula sozinho.
    reabrir_quando: "Alvo com sazonalidade tratada e história mais longa no Brasil mudar o quadro."

  - id: D07
    titulo: "Trabalho despachado é despachado"
    resposta: >
      Uma vez que um pacote vai para um executor, não se implementa em paralelo. Correr contra
      ele desperdiça a entrega e produz leitura falsa do que ele consegue fazer — e é dessa
      leitura que a tabela de roteamento é feita.
    arquivo: AGENTS.md
    reabrir_quando: nunca
    nota: "Escrita depois de eu mesclar meus PRs 37 e 38 seis minutos antes de olhar os do Jules."

  - id: D08
    titulo: "Papel do Antigravity headless (`agy`)"
    resposta: >
      Segundo par de olhos em UM arquivo, nunca decisor. Não lê arquivos, ~7 mil tokens de
      contexto por chamada, e custo que torna o lote obrigatório.
    arquivo: AGENTS.md
    reabrir_quando: >
      A CLI passar a ler arquivos em headless sem conceder permissão de comando, ou o teto de
      contexto deixar de ser a linha de comando do Windows.

validacao:
  - regra: "Nenhuma linha simulada poderia ter sido desconhecida na data pedida"
    fonte: "tests/test_vintages.py::test_no_simulated_row_could_have_been_unknown"
    nota: >
      Reescrito em 06/09: a primeira versão reafirmava a mesma condição que a função usara para
      filtrar, então quebrar published_at quebraria os dois juntos. Agora confere contra o
      calendário, que a função não calcula.

  - regra: "Só o catálogo decide se uma série tem vintages reais"
    fonte: "tests/test_vintages.py::test_without_a_declaration_there_are_no_true_vintages_whatever_the_rows_look_like"

  - regra: "Uma projeção com menos observações que parâmetros é recusada"
    fonte: "tests/test_local_projections.py::test_a_projection_with_fewer_observations_than_parameters_is_refused"

  - regra: "Uma mesclagem não pode apagar trabalho"
    fonte: "tests/test_tree.py"

  - regra: "Uma fonte que reescreva o próprio histórico faz o pipeline recusar, não corromper"
    fonte: "tests/test_pipeline.py::test_a_vintage_that_vanishes_from_the_source_is_refused_not_absorbed"

  - regra: "As participações de uma decomposição somam exatamente 1, com a composição nomeada"
    fonte: "tests/test_decomposition.py::test_as_participacoes_somam_um_em_todo_periodo"

  - regra: "Um painel que mistura vintage gravada com simulada avisa, e diz qual coluna é qual"
    fonte: "tests/test_api.py::test_mixing_recorded_and_simulated_vintages_warns"

  - regra: "O roadmap não descreve como pendente um trabalho cujos testes já existem"
    fonte: "tests/test_roadmap.py::test_a_milestone_still_to_do_does_not_already_have_its_tests"

backlog:
  - id: B01
    titulo: "Interface funcional sobre a base e os modelos"
    estado: aprovado
    nota: >
      Pedido do dono: a base E a interface, em nível funcional, para analisar variações e
      conferir se as séries estão corretas. Não havia fase para isso no plano original; virou F6.
      Precisa navegar séries, ver vintages lado a lado e rodar um modelo por especificação.

  - id: B02
    titulo: "Renderizador do painel a partir deste arquivo"
    estado: feito
    nota: >
      Entregue em 06/09/2026 como M050. `uv run python tools/render_roadmap.py` escreve
      painel/econ.html, e `--artifact` gera a cópia publicada, que passou a sair daqui em vez de
      ser escrita à mão. O mesmo endereço de antes, para abrir do celular.

  - id: B03
    titulo: "Devolver a validacao do fator dinamico quando o PR 42 entrar"
    estado: aprovado
    nota: >
      Duas regras foram tiradas da seção `validacao` porque nomeiam testes que ainda vivem no
      PR 42: o trimestre não observado estimado sem o próprio alvo, e o alvo sazonal recusado
      pelo nome. Voltam com a mesclagem. O teste que exige que toda fonte exista é o que obriga
      esta anotação a não virar dívida silenciosa.

  - id: B05
    titulo: "Marco marcado como a fazer que já está pronto: pegar isso automaticamente"
    estado: feito
    nota: >
      Três vezes em 06/09/2026 este arquivo descreveu como pendente algo que já existia — M044,
      M046 e a fase 8. A causa é sempre a mesma: escrevi de memória do plano e não do repositório.
      A regra de `preso_por` só morde marco já validado, então nada olha para o outro lado.
      Implementado no mesmo dia como
      `test_a_milestone_still_to_do_does_not_already_have_its_tests`: marco em `a_fazer` cujos
      testes de `preso_por` TODOS existem levanta suspeita. Não é prova, é sinalização — e é
      barata, porque marco sem `preso_por` nem é olhado.

  - id: B04
    titulo: "Proteção de branch na main"
    estado: aprovado
    espera: mantenedor
    nota: >
      Bloquear force-push e deleção, exigir PR e CI verde, e NÃO exigir aprovação — o GitHub não
      deixa aprovar o próprio PR e o mantenedor é o único humano.
