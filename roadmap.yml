backlog:
  - id: B06
    titulo: "Acesso pelo celular"
    estado: aprovado
    espera: mantenedor
    nota: >
      As telas cabem em tela estreita (abas no lugar de colunas) e a vista ganhou senha, que era
      o obstáculo de verdade. O que falta é decisão de rede, e é do dono.
      O PROBLEMA NÃO ERA A PORTA: era o Streamlit não ter autenticação, de modo que servir fora
      da máquina abria o painel inteiro — 33 séries não redistribuíveis incluídas — a quem
      estivesse na rede. Abrir o firewall antes de resolver isso trocaria um problema por um
      pior. Com `ECONBASE_APP_PASSWORD` no `.env`, quem entra volta a ser escolha do dono.
      Caminho recomendado: rede local, com senha preenchida, servindo em 0.0.0.0 e uma regra de
      firewall no perfil privado. A máquina está em 10.0.0.95, Wi-Fi privada. Os comandos ficaram
      com o dono porque exposição de rede e regra de firewall são decisão dele — e escrever um
      script que juntasse as duas coisas foi recusado pelo classificador, corretamente.
      Não fazer túnel para a internet sem autenticação melhor que uma senha compartilhada.

  - id: B01
    titulo: "Interface funcional sobre a base e os modelos"
    estado: aprovado
    nota: >
      Pedido do dono: a base E a interface, em nível funcional, para analisar variações e
      conferir se as séries estão corretas. Não havia fase para isso no plano original; virou F6.
      Precisa navegar séries, ver vintages lado a lado e rodar um modelo por especificação.

  - id: B02
    titulo: "Renderizador do painel a partir deste arquivo"
    estado: feito
    nota: >
      Entregue em 06/09/2026 como M050. `uv run python tools/render_roadmap.py` escreve
      painel/econ.html, e `--artifact` gera a cópia publicada, que passou a sair daqui em vez de
      ser escrita à mão. O mesmo endereço de antes, para abrir do celular.

  - id: B03
    titulo: "Devolver a validacao do fator dinamico quando o PR 42 entrar"
    estado: aprovado
    nota: >
      Duas regras foram tiradas da seção `validacao` porque nomeiam testes que ainda vivem no
      PR 42: o trimestre não observado estimado sem o próprio alvo, e o alvo sazonal recusado
      pelo nome. Voltam com a mesclagem. O teste que exige que toda fonte exista é o que obriga
      esta anotação a não virar dívida silenciosa.

  - id: B05
    titulo: "Marco marcado como a fazer que já está pronto: pegar isso automaticamente"
    estado: feito
    nota: >
      Três vezes em 06/09/2026 este arquivo descreveu como pendente algo que já existia — M044,
      M046 e a fase 8. A causa é sempre a mesma: escrevi de memória do plano e não do repositório.
      A regra de `preso_por` só morde marco já validado, então nada olha para o outro lado.
      Implementado no mesmo dia como
      `test_a_milestone_still_to_do_does_not_already_have_its_tests`: marco em `a_fazer` cujos
      testes de `preso_por` TODOS existem levanta suspeita. Não é prova, é sinalização — e é
      barata, porque marco sem `preso_por` nem é olhado.

  - id: B04
    titulo: "Proteção de branch na main"
    estado: aprovado
    espera: mantenedor
    nota: >
      Bloquear force-push e deleção, exigir PR e CI verde, e NÃO exigir aprovação — o GitHub não
      deixa aprovar o próprio PR e o mantenedor é o único humano.
