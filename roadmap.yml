      Reescrito em 06/09: a primeira versão reafirmava a mesma condição que a função usara para
      filtrar, então quebrar published_at quebraria os dois juntos. Agora confere contra o
      calendário, que a função não calcula.

  - regra: "Só o catálogo decide se uma série tem vintages reais"
    fonte: "tests/test_vintages.py::test_without_a_declaration_there_are_no_true_vintages_whatever_the_rows_look_like"

