[project]
name = "econ"
version = "0.1.0"
description = "Open-data economic database (Brazil, US, extensible) with real-time vintages, plus a macro analytics layer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Gustavo" }]
dependencies = [
  "duckdb>=1.5,<2",
  "pandas>=2.3,<4",
  "pyarrow>=21",
  "numpy>=2.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.28",
  "tenacity>=9.0",
  "typer>=0.15",
]

[project.optional-dependencies]
# Analysis stack arrives with the analyses (WP-04+); kept here so `uv sync --extra models` is stable.
models = ["statsmodels>=0.15", "scipy>=1.14"]

[project.scripts]
econbase = "econbase.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "respx>=0.22",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econbase", "src/econmodels"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "RUF018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
