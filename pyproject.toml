[project]
name = "econ"
version = "0.1.0"
description = "Open-data economic database (Brazil, US, extensible) with real-time vintages, plus a macro analytics layer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Gustavo" }]
dependencies = [
  "duckdb>=1.5,<2",
  "pandas>=2.3,<4",
  "pyarrow>=21",
  "numpy>=2.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.28",
  "tenacity>=9.0",
  "typer>=0.15",
  "tzdata>=2024.1",
  # spreadsheets published by statistical agencies: openpyxl reads .xlsx, xlrd the
  # legacy .xls that some of them still serve under an .xlsx name (NY Fed GSCPI)
  "openpyxl>=3.1",
  "xlrd>=2.0",
]

[project.optional-dependencies]
# Analysis stack arrives with the analyses (WP-04+); kept here so `uv sync --extra models` is stable.
models = ["statsmodels>=0.15", "scipy>=1.14"]
# O banco de ensaio (tools/bench_nowcast.py) NÃO tem extra aqui, de propósito.
# `uv sync --extra bench` instalaria torch e mais dezoito pacotes no mesmo ambiente que o
# agendador usa duas vezes por dia — foi o que aconteceu na primeira tentativa. Um extra
# declarado é um convite a sincronizá-lo. O ensaio roda em ambiente efêmero:
#   uv run --with torch --with chronos-forecasting python tools/bench_nowcast.py

[project.scripts]
econbase = "econbase.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "respx>=0.22",
  # the analysis stack is an optional extra for anyone who only wants the data, but the tests
  # of econmodels need it, so it is part of the development environment
  "statsmodels>=0.15",
  "scipy>=1.14",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econbase", "src/econmodels"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "RUF018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
